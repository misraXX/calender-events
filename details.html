<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>イベント詳細</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
    }
    h1 {
      text-align: center;
    }
    .event-meta {
      text-align: center;
      margin-bottom: 2rem;
    }
    .teams {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
      padding: 1rem;
    }

    .team {
      background: #fff;
      border-left: 6px solid #0077cc;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
      box-sizing: border-box;
      max-width: 100%;
    }

    .team h2 {
      margin: 0 0 1rem 0;
      text-align: center;
    }

    .member-list {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin-top: 1rem;
    }

    .member-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 120px;
    }

    .member-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 0.5rem;
    }

    .member-name {
      font-weight: bold;
      margin-bottom: 0.3rem;
      text-align: center;
    }

    .sns-icons {
      display: flex;
      justify-content: center;
      gap: 0.3rem;
    }

    .sns-icon {
      width: 28px;
      height: 28px;
    }

    @media (max-width: 768px) {
      .team {
        width: 100% !important;
      }
    }
  </style>

</head>
<body>
  <h1 id="event-title"></h1>
  <div class="event-meta">
    <p id="event-streams"></p>
  </div>
  <div class="teams" id="teams-container"></div>
  <div id="event-tweet" style="display: flex; justify-content: center;"></div>

<script>
  const urlParams = new URLSearchParams(location.search);
  const eventId = urlParams.get("id");

  fetch(`https://script.google.com/macros/s/AKfycbzb09LsiJ7OsVVMw8aDDU5JQWV9BTuOeBwnJ1toxKOg9_zS617cjClsiLHAtzWaah53/exec?id=${eventId}`)
    .then(res => res.json())
    .then(data => {
      document.getElementById("event-title").textContent = data.title || "イベント詳細";
      let streamText = "";
      if (data.mainStream) streamText += `▶️ <a href="${data.mainStream}" target="_blank">本配信</a> `;
      if (data.subStream) streamText += `📺 <a href="${data.subStream}" target="_blank">サブ配信</a>`;
      document.getElementById("event-streams").innerHTML = streamText;
      console.log(data);

      const container = document.getElementById("teams-container");
      data.teams.forEach(team => {
        const teamDiv = document.createElement("div");
        teamDiv.className = "team";
        teamDiv.innerHTML = `<h2>${team.name}</h2>`;

        const memberList = document.createElement("div");
        memberList.className = "member-list";

        team.members.forEach(member => {
          const memberDiv = document.createElement("div");
          memberDiv.className = "member-box";

          const img = document.createElement("img");
          img.src = member.icon || "https://lh6.googleusercontent.com/proxy/CNTIYcLDueUPOFa3q0HHITvuGbTBvsky-MfzskOEwpvdh_SwXqqAmdzlXxKQGOtah2o20DJUlrIiJpvbUHIqEoOMzo1-ol6W";
          img.alt = member.name;
          img.className = "member-icon";
          memberDiv.appendChild(img);

          const name = document.createElement("div");
          name.className = "member-name";
          name.textContent = member.name;
          memberDiv.appendChild(name);

          const sns = document.createElement("div");
          sns.className = "sns-icons";
          if (member.x) sns.innerHTML += `<a href="${member.x}" target="_blank"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/x.svg" alt="X" class="sns-icon"></a>`;
          if (member.twitch) sns.innerHTML += `<a href="${member.twitch}" target="_blank"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/twitch.svg" alt="Twitch" class="sns-icon"></a>`;
          if (member.youtube) sns.innerHTML += `<a href="${member.youtube}" target="_blank"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/youtube.svg" alt="YouTube" class="sns-icon"></a>`;

          memberDiv.appendChild(sns);
          memberList.appendChild(memberDiv);
        });
        if (data.tweet) {
        const tweetDiv = document.getElementById("event-tweet");
        tweetDiv.innerHTML = `
            <blockquote class="twitter-tweet">
            <a href="${data.tweet}"></a>
            </blockquote>
        `;
        twttr.widgets.load(tweetDiv);
        console.log(data.tweet)
        }

        teamDiv.appendChild(memberList);

        // ✅ 横幅をメンバー数に応じて調整
        const memberCount = team.members.length;
        const baseWidth = 120;
        const gap = 16; // margin-right相当
        const totalWidth = memberCount * (baseWidth + gap) + 40; // padding分
        teamDiv.style.width = `${Math.min(totalWidth, 1000)}px`;

        container.appendChild(teamDiv);
      });
    })
    .catch(err => {
      document.getElementById("event-title").textContent = "取得に失敗しました";
      console.error(err);
    });
</script>
<script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>

</body>
</html>
